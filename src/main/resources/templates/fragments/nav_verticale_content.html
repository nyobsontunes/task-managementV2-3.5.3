<!DOCTYPE html>
<html lang="fr"  xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Ici le Contenu du bloc de ligne Verticale : nav_verticale -->
<div th:fragment="nav_verticale_content_fragment" id="layoutSidenav_nav">
    <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
        <div class="sb-sidenav-menu">
            <div class="nav">
                <div class="sb-sidenav-menu-heading" th:text="#{commun.label.core}">Core</div>
                <a class="nav-link" th:href="@{/dashboard}">
                    <div class="sb-nav-link-icon"><i class="fas fa-tachometer-alt"></i></div>
                    <th:block th:text="#{commun.label.dashboard}"></th:block>
                </a>

                <!-- GESTION DU MODULE UTILISATEUR -->
                <sec:authorize access="hasRole('ADMIN') and hasRole('USER') and hasRole('CONSULTATION')">
                    <div class="sb-sidenav-menu-heading" th:text="#{commun.label.administration}"></div>
                    <a class="nav-link collapsed" href="#" data-bs-toggle="collapse" data-bs-target="#collapseLayouts" aria-expanded="false" aria-controls="collapseLayouts">
                        <div class="sb-nav-link-icon"><i class="fas fa-columns"></i></div>
                        <th:block th:text="#{commun.label.usersManagement}"></th:block>
                        <div class="sb-sidenav-collapse-arrow"><i class="fas fa-angle-down"></i></div>
                    </a>
                    <div class="collapse" id="collapseLayouts" aria-labelledby="headingOne" data-bs-parent="#sidenavAccordion">
                        <nav class="sb-sidenav-menu-nested nav">
                            <!--  Prend en compte un seul profil Utilisateur -->
                            <a class="nav-link" sec:authorize="hasAuthority('ADMIN')" th:href="@{/home-add-user}" th:text="#{commun.label.add}" target="_self"></a>
                            <sec:authorize access="hasRole('ADMIN') and hasRole('USER') and hasRole('CONSULTATION')">
                                <a class="nav-link" th:href="@{/home-list-users}" th:text="#{commun.label.list}" target="_self"></a>
                            </sec:authorize>
                        </nav>
                    </div>
                </sec:authorize>

                <!-- GESTION DU MODULE TACHES -->
                <th:block sec:authorize="hasAnyAuthority('ADMIN', 'USER', 'CONSULTATION')">
                    <div class="sb-sidenav-menu-heading" th:text="#{commun.label.interfacesFonctionnelles}"></div>
                    <a class="nav-link collapsed" href="#" data-bs-toggle="collapse" data-bs-target="#collapseLayouts2" aria-expanded="false" aria-controls="collapseLayouts2">
                        <div class="sb-nav-link-icon"><i class="fas fa-columns"></i></div>
                        <th:block th:text="#{commun.label.appplicationName}"></th:block>
                        <div class="sb-sidenav-collapse-arrow"><i class="fas fa-angle-down"></i></div>
                    </a>
                    <div class="collapse" id="collapseLayouts2" aria-labelledby="headingOne" data-bs-parent="#sidenavAccordion">
                        <nav class="sb-sidenav-menu-nested nav">
                            <a class="nav-link"
                               sec:authorize="hasAnyAuthority('ADMIN', 'USER')"
                               th:href="@{/home-add-task}" th:text="#{commun.label.add}" target="_self">
                            </a>
                            <a class="nav-link"
                               sec:authorize="hasAnyAuthority('ADMIN','USER','CONSULTATION')"
                               th:href="@{/home-list-tasks}" th:text="#{commun.label.list}" target="_self">
                            </a>
                        </nav>
                    </div>
                </th:block>

                <th:block sec:authorize="hasAnyAuthority('ADMIN','USER','CONSULTATION')">
                    <a class="nav-link collapsed" href="#" data-bs-toggle="collapse" data-bs-target="#collapsePages" aria-expanded="false" aria-controls="collapsePages">
                        <div class="sb-nav-link-icon"><i class="fas fa-book-open"></i></div>
                        Pages
                        <div class="sb-sidenav-collapse-arrow"><i class="fas fa-angle-down"></i></div>
                    </a>
                    <div class="collapse" id="collapsePages" aria-labelledby="headingTwo" data-bs-parent="#sidenavAccordion">
                        <nav class="sb-sidenav-menu-nested nav accordion" id="sidenavAccordionPages">
                            <a class="nav-link collapsed" href="#" data-bs-toggle="collapse" data-bs-target="#pagesCollapseAuth" aria-expanded="false" aria-controls="pagesCollapseAuth">
                                Authentication
                                <div class="sb-sidenav-collapse-arrow"><i class="fas fa-angle-down"></i></div>
                            </a>
                            <div class="collapse" id="pagesCollapseAuth" aria-labelledby="headingOne" data-bs-parent="#sidenavAccordionPages">
                                <nav class="sb-sidenav-menu-nested nav">
                                    <a class="nav-link" href="login.html">Login</a>
                                    <a class="nav-link" href="register.html">Register</a>
                                    <a class="nav-link" href="password.html">Forgot Password</a>
                                </nav>
                            </div>
                            <a class="nav-link collapsed" href="#" data-bs-toggle="collapse" data-bs-target="#pagesCollapseError" aria-expanded="false" aria-controls="pagesCollapseError">
                                Error
                                <div class="sb-sidenav-collapse-arrow"><i class="fas fa-angle-down"></i></div>
                            </a>
                            <div class="collapse" id="pagesCollapseError" aria-labelledby="headingOne" data-bs-parent="#sidenavAccordionPages">
                                <nav class="sb-sidenav-menu-nested nav">
                                    <a class="nav-link" href="401.html">401 Page</a>
                                    <a class="nav-link" href="404.html">404 Page</a>
                                    <a class="nav-link" href="500.html">500 Page</a>
                                </nav>
                            </div>
                        </nav>
                    </div>
                </th:block>



                <div class="sb-sidenav-menu-heading">Addons</div>
                <a class="nav-link" href="charts.html">
                    <div class="sb-nav-link-icon"><i class="fas fa-chart-area"></i></div>
                    Charts
                </a>
                <a class="nav-link" href="tables.html">
                    <div class="sb-nav-link-icon"><i class="fas fa-table"></i></div>
                    Tables
                </a>
            </div>
        </div>
        <div class="sb-sidenav-footer">
            <div class="small">Logged in as:
                <th:block sec:authorize="hasAuthority('ADMIN')" th:utext="${'ADMIN'}">Admin Profile.</th:block>
                <!--  ****************************************************************  -->
                <th:block sec:authorize="hasAnyAuthority('CONSULTATION','USER')">
                    <!--  ****************************************************************  -->
                    <th:block sec:authorize="hasAuthority('CONSULTATION')" th:utext="${'CONSULTATION'}"></th:block>
                    <th:block sec:authorize="hasAuthority('USER')" th:utext="${'USER'}"></th:block>
                    <!--  ****************************************************************  -->
                </th:block>
            </div>
            <!--  ****************************************************************  -->
            <th:block sec:authorize="hasAnyAuthority('ADMIN','CONSULTATION','USER')" th:utext="${session.connectedUserDB.email + '<hr/> ' + #dates.format(session.connectedUserDB.dateDerniereConnexion, 'dd/MM/yyyy') + '<hr/> ' + session.connectedUserHostName}"></th:block>
            <!--  ****************************************************************  -->
            <th:block sec:authorize="hasAnyAuthority('ADMIN','CONSULTATION','USER')" th:utext="${'<hr/>'} + ${session.connectedUserDB.lastName + ' ' + session.connectedUserDB.firstName}"></th:block>
        </div>
    </nav>
</div>
<!-- End of nav_H -->

</body>
</html>
